name: R-CMD-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: read-all

env:
  R_KEEP_PKG_SOURCE: yes

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        r: [release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::rcmdcheck

      - name: Generate and verify operational template RDS
        shell: Rscript {0}
        run: |
          source("tools/u9-native-preflight.R")

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"note"'
          upload-results: always

      - name: Build release source tarball on Linux
        if: runner.os == 'Linux'
        shell: Rscript {0}
        run: |
          status <- system2(file.path(R.home("bin"), "R"), c("CMD", "build", "."))
          if (!identical(status, 0L)) stop("R CMD build failed", call. = FALSE)

      - name: SHA-256 release tarball on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sha256sum BreedReliabR_0.1.2.tar.gz > BreedReliabR_0.1.2_SHA256.txt

      - name: Upload Linux release candidate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BreedReliabR-0.1.2-release-candidate
          path: |
            BreedReliabR_0.1.2.tar.gz
            BreedReliabR_0.1.2_SHA256.txt
          if-no-files-found: error
