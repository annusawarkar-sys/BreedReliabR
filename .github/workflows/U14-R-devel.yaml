name: U14 R-devel CRAN gate

on:
  push:
    branches:
      - u14-cran-gate
  workflow_dispatch:

permissions: read-all

env:
  R_KEEP_PKG_SOURCE: yes

jobs:
  r-devel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.1.2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: devel
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-tinytex@v2
        env:
          TINYTEX_INSTALLER: TinyTeX

      - name: Install HTML Tidy
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tidy

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: |
            any::rcmdcheck
            any::V8

      - name: Verify exact release identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "11ae007f051a2c3ab5545c391809d3dc1d03ce81"

      - name: Generate and verify canonical template RDS
        shell: Rscript {0}
        run: |
          source("tools/u9-native-preflight.R")

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          error-on: '"warning"'
          upload-results: always
